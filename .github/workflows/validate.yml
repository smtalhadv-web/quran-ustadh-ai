name: Validate prototype
on:
  push:
    branches: ["main"]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/data/quran.js
          node --check src/services/quran-service.js
          node --check src/services/storage-service.js
          node --check src/services/learning-engine.js
          node --check src/services/mock-recitation-service.js
          node --check src/services/recorder-service.js
          node --check src/services/supabase-service.js
          node --check src/services/open-indopak-service.js
      - name: Required files
        run: |
          test -f index.html
          test -f manifest.webmanifest
          test -f supabase/migrations/001_initial_schema.sql
